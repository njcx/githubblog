<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1560" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1440e"/>
    </marker>
  </defs>

  <rect width="1400" height="1560" fill="#f7f8fa"/>

  <!-- Title -->
  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2430">OpenClaw 安全接入点全景图</text>
  <text x="700" y="74" text-anchor="middle" font-size="14" fill="#6b7280">五个安全检查点在 Agent 运行管线中的位置 · 唯一支持第三方插件的环节以红框标出</text>

  <!-- ===================== Lane labels ===================== -->
  <text x="40" y="120" font-size="13" font-weight="700" fill="#9aa1ac">用户 / 数据流</text>

  <!-- Row: entry actors -->
  <rect x="40" y="140" width="200" height="56" rx="10" fill="#eef1f5" stroke="#c7ccd4"/>
  <text x="140" y="164" text-anchor="middle" font-size="13" fill="#2b3240">用户 / Operator</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#6b7280">安装 skill / plugin / 下达指令</text>

  <rect x="1160" y="140" width="200" height="56" rx="10" fill="#eef1f5" stroke="#c7ccd4"/>
  <text x="1260" y="164" text-anchor="middle" font-size="13" fill="#2b3240">外部世界</text>
  <text x="1260" y="182" text-anchor="middle" font-size="11" fill="#6b7280">email / webhook / web_fetch</text>

  <!-- ================= ① Install-time box (highlighted) ================= -->
  <rect x="40" y="230" width="1320" height="330" rx="14" fill="#fff5f0" stroke="#c1440e" stroke-width="2.5" stroke-dasharray="0"/>
  <text x="62" y="260" font-size="16" font-weight="700" fill="#c1440e">① 安装时（Install-time）—— 唯一支持第三方安全插件的接入点</text>

  <rect x="70" y="278" width="230" height="60" rx="8" fill="#ffffff" stroke="#c1440e"/>
  <text x="185" y="300" text-anchor="middle" font-size="12.5" fill="#2b3240">skill / npm 包 / git / 本地文件</text>
  <text x="185" y="318" text-anchor="middle" font-size="11" fill="#8a4a2e">install-security-scan.runtime.ts</text>
  <text x="185" y="333" text-anchor="middle" font-size="10.5" fill="#8a4a2e">scanBundle / scanPackage / scanFile ...</text>

  <path d="M300,308 L360,308" stroke="#c1440e" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="365" y="278" width="270" height="130" rx="8" fill="#ffffff" stroke="#c1440e" stroke-width="2"/>
  <text x="500" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#c1440e">runInstallPolicy()</text>
  <text x="500" y="317" text-anchor="middle" font-size="10.5" fill="#6b7280">src/security/install-policy.ts</text>
  <text x="500" y="335" text-anchor="middle" font-size="11" fill="#2b3240">spawn 外部可执行程序</text>
  <text x="500" y="351" text-anchor="middle" font-size="11" fill="#2b3240">stdin ← JSON 请求</text>
  <text x="500" y="367" text-anchor="middle" font-size="11" fill="#2b3240">stdout → JSON 决策</text>
  <text x="500" y="386" text-anchor="middle" font-size="10.5" fill="#8a4a2e" font-weight="600">配置: security.installPolicy.exec</text>

  <path d="M635,320 L700,320" stroke="#c1440e" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="705" y="278" width="230" height="60" rx="8" fill="#fff0e6" stroke="#c1440e" stroke-width="2.5"/>
  <text x="820" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#c1440e">🔌 你的安全扫描插件</text>
  <text x="820" y="318" text-anchor="middle" font-size="10.5" fill="#8a4a2e">任意语言 · 读stdin写stdout</text>
  <text x="820" y="332" text-anchor="middle" font-size="10.5" fill="#8a4a2e">decision: allow/warn/block</text>

  <path d="M365,400 L300,400 L300,338" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="70" y="382" width="230" height="46" rx="8" fill="#ffffff" stroke="#8a93a2"/>
  <text x="185" y="410" text-anchor="middle" font-size="11.5" fill="#2b3240">before_install JS 钩子（并行触发）</text>

  <rect x="365" y="425" width="270" height="55" rx="8" fill="#ffffff" stroke="#8a93a2"/>
  <text x="500" y="447" text-anchor="middle" font-size="12" fill="#2b3240">install-policy-response.ts</text>
  <text x="500" y="463" text-anchor="middle" font-size="10.5" fill="#6b7280">Zod 校验响应 · 格式错误 fail-closed</text>

  <path d="M500,408 L500,425" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M500,480 L500,505" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="365" y="505" width="270" height="45" rx="8" fill="#eef1f5" stroke="#8a93a2"/>
  <text x="500" y="532" text-anchor="middle" font-size="12" fill="#2b3240">runOperatorInstallPolicy()</text>

  <rect x="680" y="505" width="330" height="45" rx="8" fill="#eef1f5" stroke="#8a93a2"/>
  <text x="845" y="524" text-anchor="middle" font-size="11.5" fill="#2b3240">allow=放行 / warn=人工审批(指纹防重放) / block=拒绝</text>
  <text x="845" y="540" text-anchor="middle" font-size="10" fill="#6b7280">超时·非0退出·非法JSON 均 fail-closed</text>
  <path d="M635,527 L680,527" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= Main pipeline row ================= -->
  <text x="40" y="600" font-size="13" font-weight="700" fill="#9aa1ac">Agent 运行时管线（内置，不对外开放插件）</text>

  <!-- ② tool policy -->
  <rect x="40" y="620" width="300" height="130" rx="12" fill="#eef3ff" stroke="#3b5bdb" stroke-width="1.6"/>
  <text x="190" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3a8c">② 工具可见性</text>
  <text x="190" y="666" text-anchor="middle" font-size="11" fill="#3b5bdb">tool-policy-pipeline.ts</text>
  <text x="190" y="686" text-anchor="middle" font-size="11" fill="#2b3240">会话建立时逐层过滤</text>
  <text x="190" y="703" text-anchor="middle" font-size="10.5" fill="#6b7280">profile→全局→provider→</text>
  <text x="190" y="718" text-anchor="middle" font-size="10.5" fill="#6b7280">per-agent→group→sender</text>
  <text x="190" y="738" text-anchor="middle" font-size="10" fill="#9aa1ac">仅 config 驱动，无代码钩子</text>

  <!-- ③ exec approval -->
  <rect x="370" y="620" width="330" height="130" rx="12" fill="#eef3ff" stroke="#3b5bdb" stroke-width="1.6"/>
  <text x="535" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3a8c">③ 命令执行审批</text>
  <text x="535" y="666" text-anchor="middle" font-size="11" fill="#3b5bdb">bash-tools.exec-run.ts</text>
  <text x="535" y="666" text-anchor="middle" font-size="11" fill="#3b5bdb" dy="0"> </text>
  <text x="535" y="682" text-anchor="middle" font-size="10.5" fill="#3b5bdb">exec-host-gateway.ts processGatewayAllowlist()</text>
  <text x="535" y="701" text-anchor="middle" font-size="10.5" fill="#2b3240">白名单/人工审批/LLM自动审查</text>
  <text x="535" y="718" text-anchor="middle" font-size="10.5" fill="#2b3240">spawn前 beforeSpawn 二次校验(TOCTOU)</text>
  <text x="535" y="738" text-anchor="middle" font-size="10" fill="#9aa1ac">内置逻辑，仅 config 调参</text>

  <!-- ④ sandbox -->
  <rect x="730" y="620" width="280" height="130" rx="12" fill="#eef3ff" stroke="#3b5bdb" stroke-width="1.6"/>
  <text x="870" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3a8c">④ 沙箱容器创建校验</text>
  <text x="870" y="666" text-anchor="middle" font-size="11" fill="#3b5bdb">validate-sandbox-security.ts</text>
  <text x="870" y="686" text-anchor="middle" font-size="10.5" fill="#2b3240">bind mount / symlink 逃逸检测</text>
  <text x="870" y="703" text-anchor="middle" font-size="10.5" fill="#2b3240">网络模式(禁host) / seccomp·AppArmor</text>
  <text x="870" y="738" text-anchor="middle" font-size="10" fill="#9aa1ac">内置逻辑，仅 config 调参</text>

  <!-- ⑤ external content -->
  <rect x="1040" y="620" width="320" height="130" rx="12" fill="#eef8ee" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="1200" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#1f7a34">⑤ 外部内容进入上下文</text>
  <text x="1200" y="666" text-anchor="middle" font-size="11" fill="#2f9e44">security/external-content.ts</text>
  <text x="1200" y="686" text-anchor="middle" font-size="10.5" fill="#2b3240">wrapExternalContent() / wrapWebContent()</text>
  <text x="1200" y="703" text-anchor="middle" font-size="10.5" fill="#2b3240">随机边界标记 · 剥除伪造标记/特殊token</text>
  <text x="1200" y="720" text-anchor="middle" font-size="10.5" fill="#2b3240">附加"不要当作指令"警告</text>
  <text x="1200" y="738" text-anchor="middle" font-size="10" fill="#1f7a34">⚠ Code插件可 import 复用，不能替换默认行为</text>

  <!-- flow arrows into pipeline -->
  <path d="M140,196 L140,620" stroke="#8a93a2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1260,196 L1200,620" stroke="#8a93a2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,685 L370,685" stroke="#8a93a2" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M700,685 L730,685" stroke="#8a93a2" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- connection from install-time box down to agent loop -->
  <path d="M190,560 L190,620" stroke="#c1440e" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="205" y="595" font-size="10.5" fill="#c1440e">安装通过后，skill/plugin 才进入运行时</text>

  <!-- ================= Agent core loop ================= -->
  <rect x="40" y="800" width="1320" height="120" rx="12" fill="#f1f2f5" stroke="#8a93a2" stroke-width="1.4"/>
  <text x="700" y="828" text-anchor="middle" font-size="14" font-weight="700" fill="#2b3240">Agent 核心循环（Claude Agent SDK 运行时）</text>
  <text x="700" y="852" text-anchor="middle" font-size="11.5" fill="#4b5261">模型读取工具列表(②的产出) → 决定调用工具 → 命中 exec 触发③ → 需要容器则触发④ → 引入外部数据触发⑤</text>
  <text x="700" y="876" text-anchor="middle" font-size="11" fill="#6b7280">src/agents/ · src/gateway/ · src/mcp/</text>
  <text x="700" y="898" text-anchor="middle" font-size="10.5" fill="#9aa1ac">审计事件统一汇入 emitTrustedSecurityEvent() → src/security/audit.ts（openclaw security audit）</text>

  <path d="M190,750 L190,800" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M535,750 L535,800" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M870,750 L870,800" stroke="#3b5bdb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M1200,750 L1200,800" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= Audit layer ================= -->
  <rect x="40" y="940" width="1320" height="90" rx="12" fill="#fffbe6" stroke="#d9a400" stroke-width="1.4"/>
  <text x="700" y="968" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d00">审计与静态分析层（贯穿全程，非插入点）</text>
  <text x="700" y="992" text-anchor="middle" font-size="11" fill="#6b5400">security/audit.ts 汇总审计报告 · security/opengrep/ 规则扫描(CI) · .github/codeql/ 边界专用查询包 · src/logging/redact*.ts 日志脱敏</text>

  <path d="M700,920 L700,940" stroke="#d9a400" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= Legend ================= -->
  <rect x="40" y="1060" width="1320" height="150" rx="12" fill="#ffffff" stroke="#c7ccd4"/>
  <text x="62" y="1088" font-size="14" font-weight="700" fill="#1f2430">图例 / 结论</text>

  <rect x="62" y="1102" width="22" height="16" fill="#fff0e6" stroke="#c1440e" stroke-width="2"/>
  <text x="92" y="1114" font-size="12" fill="#2b3240">红色 = 官方开放的第三方插件挂载点（security.installPolicy.exec / before_install 钩子）</text>

  <rect x="62" y="1128" width="22" height="16" fill="#eef3ff" stroke="#3b5bdb" stroke-width="1.6"/>
  <text x="92" y="1140" font-size="12" fill="#2b3240">蓝色 = 内置运行时防护，仅支持 config 调参，不接受外部代码接入</text>

  <rect x="62" y="1154" width="22" height="16" fill="#eef8ee" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="92" y="1166" font-size="12" fill="#2b3240">绿色 = 内置防护，但相关函数通过 plugin-sdk/security-runtime.ts 导出，Code 插件可复用其原语</text>

  <rect x="62" y="1180" width="22" height="16" fill="#fffbe6" stroke="#d9a400" stroke-width="1.4"/>
  <text x="92" y="1192" font-size="12" fill="#2b3240">黄色 = 审计/静态分析层，记录与检测，不参与实时放行/拦截决策</text>

  <!-- ================= Protocol detail card ================= -->
  <rect x="40" y="1240" width="1320" height="290" rx="12" fill="#ffffff" stroke="#c1440e" stroke-width="1.6"/>
  <text x="62" y="1270" font-size="15" font-weight="700" fill="#c1440e">install-policy.exec 协议速览（做安全插件请对接这里）</text>

  <text x="62" y="1300" font-size="12.5" font-weight="700" fill="#2b3240">配置</text>
  <text x="62" y="1320" font-size="11.5" fill="#4b5261" font-family="Menlo,Consolas,monospace">security.installPolicy.exec.command  // 绝对路径，非symlink，权限收紧</text>
  <text x="62" y="1338" font-size="11.5" fill="#4b5261" font-family="Menlo,Consolas,monospace">security.installPolicy.exec.timeoutMs / maxOutputBytes</text>

  <text x="62" y="1370" font-size="12.5" font-weight="700" fill="#2b3240">请求 (stdin JSON)</text>
  <text x="62" y="1390" font-size="11.5" fill="#4b5261" font-family="Menlo,Consolas,monospace">targetType, targetName, sourcePath, source.authority, request.kind</text>

  <text x="62" y="1420" font-size="12.5" font-weight="700" fill="#2b3240">响应 (stdout JSON)</text>
  <text x="62" y="1440" font-size="11.5" fill="#4b5261" font-family="Menlo,Consolas,monospace">{ decision: "allow"|"warn"|"block", reason?, findings?: [{ruleId,severity,message,...}] }</text>

  <text x="62" y="1470" font-size="12.5" font-weight="700" fill="#c1440e">Fail-closed 规则</text>
  <text x="62" y="1490" font-size="11.5" fill="#4b5261">非0退出 / 空输出 / JSON非法 / 超时 / 超出maxOutputBytes → 一律视为 block（security_scan_failed）</text>
  <text x="62" y="1508" font-size="11.5" fill="#4b5261">warn 决策附带 SHA-256 指纹（基于 reason+findings），防止人工批准后扫描结果被偷换而不触发重新审批</text>

</svg>
